# Вставить внутрь server { ... } для vaxterfive.ru (443 ssl).
# ЗАМЕНИТЕ /vf-ЗАМЕНИТЕ-НА-СВОЙ/ на значение ADMIN_PREFIX из /etc/vaxterfive-admin.env (в обоих местах).

# Исходники и служебные файлы не отдаются как статика
location ~ ^/(catalog-src|admin-app)/ { return 404; }

# Публичный приём заявок с лендинга (единственный публичный маршрут приложения)
location = /api/lead {
    limit_except POST { deny all; }
    client_max_body_size 12m;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:5600;
}

# Старый адрес — просто 404, без подсказок
location ^~ /admin { return 404; }

location ^~ /vf-ЗАМЕНИТЕ-НА-СВОЙ/ {
    # необязательно: ещё и только из офиса/VPN
    # allow 203.0.113.10;
    # deny all;

    client_max_body_size 160m;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # перезаписываем — IP нельзя подделать
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_pass http://127.0.0.1:5600;
}
