{% extends "base.html" %}{% block title %}Вход{% endblock %}
{% block body %}
<div class="login">
  <div class="login-card">
    <span class="logo"><a href="/" title="На сайт vaxterfive.ru"><img class="logo-img" src="/img/logo.png" alt="Vaxter Five"></a><small class="logo-sub">Админ-панель</small></span>
    <h1>Вход</h1>
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label>Логин<input name="username" autocomplete="username" required maxlength="64" autofocus autocapitalize="none" spellcheck="false"></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label>
      <button class="btn wide">Войти</button>
    </form>
    <p class="hint">Доступ только для сотрудников. Забыли пароль — попросите администратора.</p>
  </div>
</div>
{% endblock %}
