{% extends "base.html" %}{% block title %}Пароль{% endblock %}
{% block body %}
<div class="head"><div><span class="mono">{{ me.name }}</span><h1>Сменить пароль</h1></div></div>
<form method="post" class="card-f narrow">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label>Текущий пароль<input name="old" type="password" required autocomplete="current-password"></label>
  <label>Новый пароль<input name="new" type="password" required minlength="16" autocomplete="new-password"><small>Не короче 16 символов, буквы + цифры/символы.</small></label>
  <label>Новый пароль ещё раз<input name="new2" type="password" required minlength="16" autocomplete="new-password"></label>
  <div class="formact"><button class="btn">Сменить</button></div>
</form>
{% endblock %}
